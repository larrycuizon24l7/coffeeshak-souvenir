<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Souvenir Camera</title>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #camera-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .mirror { transform: scaleX(-1); }
        
        #frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; object-fit: cover; z-index: 5; }
        #capture-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; background: white; border: 5px solid rgba(0,0,0,0.3); border-radius: 50%; cursor: pointer; z-index: 10; }
        #switch-btn { position: absolute; bottom: 50px; right: 30px; width: 50px; height: 50px; background: rgba(0,0,0,0.5); border: 2px solid white; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; z-index: 10; display: flex; justify-content: center; align-items: center; }
        #canvas { display: none; }

        /* 🍏 iOS SMART OPTIMIZATION MODAL DISPLAY */
        #ios-preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #ios-preview-image {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            -webkit-touch-callout: default !important; /* Forces iOS to allow image long-press saving */
            user-select: auto !important;
        }
        .modal-instruction {
            color: #FFFFFF;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
            text-shadow: 0px 2px 5px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }
        .close-modal-btn {
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white; border-radius: 20px;
            font-size: 14px; cursor: pointer;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="camera-container">
    <video id="webcam" class="mirror" autoplay playsinline></video>
    <img id="frame-overlay" src="" alt="Seasonal Frame">
    <button id="capture-btn" onclick="takePhoto()"></button>
    <button id="switch-btn" onclick="switchCamera()">🔄</button>
</div>

<!-- DYNAMIC IOS SAVING INTERFACE PORTAL -->
<div id="ios-preview-modal">
    <img id="ios-preview-image" src="" alt="Your Souvenir">
    <div class="modal-instruction">👉 Press and Hold Image to Save! 👈<br><span style="font-size:13px; font-weight:normal; color:#F3E5AB;">(Pindutin at diinan para ma-save sa Photos)</span></div>
    <button class="close-modal-btn" onclick="closePreview()">Retake Photo 📸</button>
</div>

<img id="frame-source" src="" style="display:none;">
<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const frameOverlay = document.getElementById('frame-overlay');
    const frameSource = document.getElementById('frame-source');
    const iosModal = document.getElementById('ios-preview-modal');
    const iosImage = document.getElementById('ios-preview-image');
    
    let currentStream = null;
    let currentFacingMode = "user"; 

    const currentMonthIndex = new Date().getMonth();
    const monthlyFrameFiles = [
        "january.png", "february.png", "march.png", "april.png", "may.png", "june.png",
        "july.png", "august.png", "september.png", "october.png", "november.png", "december.png"
    ];

    const activeFrameFile = monthlyFrameFiles[currentMonthIndex];
    frameOverlay.src = activeFrameFile;
    frameSource.src = activeFrameFile;

    // Detect if client device runs iOS metadata structures
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    function startCamera(facingMode) {
        if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
        if (facingMode === "user") { video.classList.add('mirror'); } else { video.classList.remove('mirror'); }

        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false 
        })
        .then(stream => { currentStream = stream; video.srcObject = stream; })
        .catch(err => { alert("Please allow Camera Access!"); });
    }

    function switchCamera() {
        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        startCamera(currentFacingMode);
    }

    startCamera(currentFacingMode);

    function closePreview() {
        iosModal.style.display = "none";
    }

    function takePhoto() {
        const ctx = canvas.getContext('2d');
        const targetWidth = 1080; const targetHeight = 1920;
        canvas.width = targetWidth; canvas.height = targetHeight;
        
        const videoWidth = video.videoWidth; const videoHeight = video.videoHeight;
        const videoAspectRatio = videoWidth / videoHeight; const targetAspectRatio = targetWidth / targetHeight;
        
        let sourceX = 0; let sourceY = 0; let sourceWidth = videoWidth; let sourceHeight = videoHeight;
        if (videoAspectRatio > targetAspectRatio) { sourceWidth = videoHeight * targetAspectRatio; sourceX = (videoWidth - sourceWidth) / 2; } 
        else { sourceHeight = videoWidth / targetAspectRatio; sourceY = (videoHeight - sourceHeight) / 2; }

        ctx.save();
        if (currentFacingMode === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        ctx.drawImage(frameSource, 0, 0, targetWidth, targetHeight);

        const imgDataDataURL = canvas.toDataURL('image/png');

        if (isIOS) {
            /* 🍏 IOS PIPELINE: TRIGGERS HIGH-CONTRAST INTERACTIVE PREVIEW IF DEVICE IS IPHONE */
            iosImage.src = imgDataDataURL;
            iosModal.style.display = "flex";
        } else {
            /* 🤖 ANDROID PIPELINE: RUNS AUTOMATIC NATIVE DOWNLOAD SILENTLY */
            const link = document.createElement('a');
            link.download = 'coffeeshak-souvenir.png';
            link.href = imgDataDataURL;
            link.click();
        }
    }
</script>
</body>
</html>
